<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Macros</title>
    <link href="static/woz.css" rel="stylesheet" type="text/css" />
    <script src="static/jquery-3.5.1.min.js"></script>
    <script src="static/woz.js"></script>
    <script src="static/macros.js"></script>
</head>

<body onload="onLoad()">

    <div id="content">
        <div id="header">
            <div id="breadcrumb">{{ session['user_name'] }}, {{ session['user_surname'] }}
                <a href="login"><img src="static/images/back.png" width="3%" alt="back" /></a>
            </div>

            <div class="tab tab--off">
            <a href="scenarios">Scénario et Jeux</a></div>
            <div class="tab tab--off">
            <a href="reactions">Réactions</a> </div>
            <div class="tab tab--off">
            <a href="maison">Maison</a> </div>
            <div class="tab tab--off">
            <a href="theatre">RobotAct</a> </div>
            <div class="tab tab--on">
            <a href="macros">Macros</a> </div>
        </div>

        <div id="body">
            <div id="body-left"></div>
            <div id="body-right">
                <img class="bottom_right" src="static/images/info.png" width="15%" alt="info" onClick="showInfo()" />
            </div>

            <div class="macros-container">

                <h2 class="macros-section-title">Mouvements rapides</h2>
                <div id="quick-grid" class="macro-grid"></div>

                <h2 class="macros-section-title">Moteurs</h2>
                <div class="macro-grid">
                    <button class="macro-btn macro-btn--relax" id="btn-relax">Relax (déstiffener)</button>
                    <button class="macro-btn macro-btn--stiffen" id="btn-stiffen">Stiffener</button>
                </div>

                <h2 class="macros-section-title">Mes boutons</h2>
                <div id="homebrew-grid" class="macro-grid"></div>

                <form id="add-form" class="macro-add-form">
                    <div class="macro-form-row">
                        <input id="new-label" type="text" placeholder="Nom du bouton" required />
                    </div>
                    <div class="macro-form-row">
                        <select id="new-motion"></select>
                    </div>
                    <div class="macro-form-row">
                        <select id="new-emotion"></select>
                    </div>
                    <div class="macro-form-row macro-form-row--led">
                        <select id="new-led"></select>
                        <input id="new-led-color" type="color" value="#ffffff" title="Couleur LED" />
                    </div>
                    <div class="macro-form-row">
                        <input id="new-speak" type="text" placeholder="Texte à dire (optionnel)" />
                    </div>
                    <button type="submit" class="macro-add-btn">+ Ajouter</button>
                </form>

            </div>
        </div>

        <div id="footer"></div>
    </div>

</body>
</html>
