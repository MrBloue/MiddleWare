<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Macros</title>
    <link href="/static/woz.css" rel="stylesheet" type="text/css" />
    <script src="/static/jquery-3.5.1.min.js"></script>
    <script>var WOZ_RID = {{ rid }};</script>
    <script src="/static/woz.js"></script>
    <script src="/static/macros.js"></script>
</head>

<body onload="onLoad()">

    <div id="content">
        <div id="header">
            <div id="breadcrumb">{{ child_name }}
                <a href="/robots"><img src="/static/images/back.png" width="3%" alt="back" /></a>
            </div>

            <div class="tab tab--off">
            <a href="/r/{{ rid }}/scenarios">Scénario et Jeux</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/reactions">Réactions</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/maison">Maison</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/theatre">RobotAct</a></div>
            <div class="tab tab--on">
            <a href="/r/{{ rid }}/macros">Macros</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/vocal">Vocal</a></div>
        </div>

        <div id="body">
            <div id="body-left"></div>
            <div id="body-right">
                <img class="bottom_right" src="/static/images/info.png" width="15%" alt="info" onClick="showInfo()" />
            </div>

            <div class="macros-container">

                <h2 class="macros-section-title">Mouvements rapides</h2>
                <div id="quick-grid" class="macro-grid"></div>

                <h2 class="macros-section-title">Moteurs</h2>
                <div class="macro-grid">
                    <button class="macro-btn macro-btn--relax" id="btn-relax">Relax (déstiffener)</button>
                    <button class="macro-btn macro-btn--stiffen" id="btn-stiffen">Stiffener</button>
                </div>

                <h2 class="macros-section-title">Mes boutons</h2>
                <div id="homebrew-grid" class="macro-grid"></div>

                <form id="add-form" class="macro-add-form">
                    <div class="macro-form-row">
                        <input id="new-label" type="text" placeholder="Nom du bouton" required />
                    </div>
                    <div class="macro-form-row macro-form-row--motions">
                        <select id="new-motion-pick"></select>
                        <input id="new-motion-speed" type="number" min="0.1" max="1.0" step="0.1" value="0.5" title="Vitesse (0.1–1.0)" />
                        <input id="new-motion-duration" type="number" min="0.5" max="60" step="0.5" value="3" title="Durée avant prochain mouvement (s)" />
                        <button type="button" id="btn-add-motion" class="motion-add-btn">+</button>
                    </div>
                    <div id="motion-list" class="motion-list"></div>
                    <div class="macro-form-row">
                        <select id="new-emotion"></select>
                    </div>
                    <div class="macro-form-row macro-form-row--led">
                        <select id="new-led"></select>
                        <input id="new-led-color" type="color" value="#ffffff" title="Couleur LED" />
                    </div>
                    <div class="macro-form-row">
                        <input id="new-speak" type="text" placeholder="Texte à dire (optionnel)" />
                    </div>
                    <button type="submit" class="macro-add-btn">+ Ajouter</button>
                </form>

            </div>
        </div>

        <div id="footer"></div>
    </div>

</body>
</html>
