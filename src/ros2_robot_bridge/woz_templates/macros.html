<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Macros</title>
    <link href="/static/woz.css" rel="stylesheet" type="text/css" />
    <script src="/static/jquery-3.5.1.min.js"></script>
    <script>var WOZ_RID = {{ rid }};</script>
    <script src="/static/woz.js"></script>
    <script src="/static/macros.js"></script>
    <script src="/static/blocks.js"></script>
    <style>
        .blocks-wrap{display:flex;height:540px;border:1px solid #333;border-radius:6px;overflow:hidden;margin-top:8px;background:#1a1a2e;}
        .blocks-palette{width:148px;flex-shrink:0;background:#1a1a2e;border-right:2px solid #333;overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:10px;}
        .pal-section-title{font-size:.68em;font-weight:bold;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin:0 0 4px;}
        .pal-blk{display:block;padding:7px 9px;border-radius:6px;font-size:.8em;color:#fff;cursor:grab;user-select:none;margin-bottom:4px;border:none;text-align:left;transition:filter .15s;}
        .pal-blk:hover{filter:brightness(1.25);}
        .blocks-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;}
        .blocks-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#111;border-bottom:1px solid #333;flex-shrink:0;flex-wrap:wrap;}
        .blocks-toolbar button{padding:5px 12px;border:none;border-radius:5px;font-size:.85em;cursor:pointer;font-weight:bold;}
        #btn-run{background:#2e7d32;color:#fff;}#btn-run:hover:not(:disabled){background:#43a047;}
        #btn-stop{background:#b71c1c;color:#fff;}#btn-stop:hover:not(:disabled){background:#e53935;}
        #btn-clear{background:#444;color:#ccc;}#btn-clear:hover{background:#666;}
        .blocks-toolbar button:disabled{opacity:.4;cursor:not-allowed;}
        .prog-status{font-size:.82em;color:#aaa;}
        .prog-status--on{color:#76ff03;font-weight:bold;}
        .toolbar-sep{flex:1;}
        .save-row{display:flex;gap:5px;align-items:center;}
        .save-row input{padding:4px 7px;border-radius:4px;border:1px solid #555;background:#222;color:#eee;font-size:.82em;width:120px;}
        #btn-save{background:#1565c0;color:#fff;padding:5px 10px;}#btn-save:hover{background:#1976d2;}
        .blocks-body{flex:1;display:flex;overflow:hidden;}
        #prog-root{flex:1;overflow-y:auto;padding:10px 12px;}
        .saved-panel{width:160px;flex-shrink:0;background:#111;border-left:1px solid #333;overflow-y:auto;padding:8px 7px;}
        .saved-panel h3{font-size:.72em;color:#aaa;text-transform:uppercase;letter-spacing:1px;margin:0 0 6px;}
        .saved-row{display:flex;align-items:center;gap:3px;margin-bottom:5px;}
        .saved-name{flex:1;font-size:.8em;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
        .saved-btn{background:none;border:none;cursor:pointer;font-size:.9em;padding:2px 4px;border-radius:3px;}
        .saved-btn:hover{background:#333;}
        .saved-empty{font-size:.78em;color:#666;font-style:italic;}
        .dz{height:7px;border-radius:4px;margin:1px 0;transition:all .15s;}
        .dz--hover{height:26px;background:rgba(100,200,255,.2);border:2px dashed #4fc3f7;}
        .dz--hint{height:38px;border:2px dashed #444;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#555;font-size:.82em;margin:3px 0;}
        .dz--hint.dz--hover{border-color:#4fc3f7;color:#4fc3f7;background:rgba(100,200,255,.1);}
        .blk{border-radius:6px;border:1px solid rgba(255,255,255,.08);background:#1e1e1e;margin:0;cursor:grab;user-select:none;}
        .blk:active{cursor:grabbing;}
        .blk-hdr{display:flex;align-items:center;gap:5px;padding:4px 7px;border-radius:6px;flex-wrap:wrap;}
        .blk-grip{color:rgba(255,255,255,.5);font-size:1.05em;cursor:grab;}
        .blk-lbl{font-size:.79em;font-weight:bold;color:rgba(255,255,255,.95);white-space:nowrap;}
        .blk-del{margin-left:auto;background:rgba(0,0,0,.35);border:none;color:rgba(255,255,255,.6);border-radius:4px;width:20px;height:20px;font-size:.95em;cursor:pointer;flex-shrink:0;line-height:1;}
        .blk-del:hover{background:rgba(255,0,0,.5);color:#fff;}
        .blk-field{display:inline-flex;align-items:center;gap:3px;}
        .blk-field-lbl{font-size:.72em;color:rgba(255,255,255,.7);white-space:nowrap;}
        .blk-select,.blk-text,.blk-num{padding:2px 4px;border-radius:4px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.4);color:#fff;font-size:.78em;}
        .blk-select{max-width:120px;}.blk-text{width:150px;}.blk-num{width:46px;}
        .blk-color{width:30px;height:20px;padding:1px;border:none;border-radius:4px;cursor:pointer;}
        .blk-range-wrap{display:inline-flex;align-items:center;gap:3px;}
        .blk-range{width:60px;accent-color:rgba(255,255,255,.8);}
        .blk-range-val{font-size:.75em;color:rgba(255,255,255,.8);min-width:20px;}
        .blk-branch-lbl{font-size:.7em;color:#aaa;padding:2px 10px 0;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;}
        .blk-body{padding:3px 5px 5px 18px;background:rgba(0,0,0,.2);border-top:1px solid rgba(255,255,255,.06);}
    </style>
</head>

<body onload="onLoad()">

    <div id="content">
        <div id="header">
            <div id="breadcrumb">{{ child_name }}
                <a href="/robots"><img src="/static/images/back.png" width="3%" alt="back" /></a>
            </div>

            <div class="tab tab--off">
            <a href="/r/{{ rid }}/scenarios">Scénario et Jeux</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/reactions">Réactions</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/maison">Maison</a></div>
            <div class="tab tab--on">
            <a href="/r/{{ rid }}/macros">Macros</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/vocal">Vocal</a></div>
        </div>

        <div id="body">
            <div id="body-left"></div>
            <div id="body-right"></div>

            <div class="macros-container">

                <h2 class="macros-section-title">Mouvements rapides</h2>
                <div id="quick-grid" class="macro-grid"></div>

                <h2 class="macros-section-title">Moteurs</h2>
                <div class="macro-grid">
                    <button class="macro-btn macro-btn--relax" id="btn-relax">Relax (déstiffener)</button>
                    <button class="macro-btn macro-btn--stiffen" id="btn-stiffen">Stiffener</button>
                </div>

                <div class="level-2-up">
                    <h2 class="macros-section-title">Mes boutons</h2>
                    <div id="homebrew-grid" class="macro-grid"></div>

                    <form id="add-form" class="macro-add-form">
                        <div class="macro-form-row">
                            <input id="new-label" type="text" placeholder="Nom du bouton" required />
                        </div>
                        <div class="macro-form-row macro-form-row--motions">
                            <select id="new-motion-pick"></select>
                            <input id="new-motion-speed" type="number" min="0.1" max="1.0" step="0.1" value="0.5" title="Vitesse (0.1–1.0)" />
                            <input id="new-motion-duration" type="number" min="0.5" max="60" step="0.5" value="3" title="Durée avant prochain mouvement (s)" />
                            <button type="button" id="btn-add-motion" class="motion-add-btn">+</button>
                        </div>
                        <div id="motion-list" class="motion-list"></div>
                        <div class="macro-form-row">
                            <select id="new-emotion"></select>
                        </div>
                        <div class="macro-form-row macro-form-row--led">
                            <select id="new-led"></select>
                            <input id="new-led-color" type="color" value="#ffffff" title="Couleur LED" />
                        </div>
                        <div class="macro-form-row">
                            <input id="new-speak" type="text" placeholder="Texte à dire (optionnel)" />
                        </div>
                        <button type="submit" class="macro-add-btn">+ Ajouter</button>
                    </form>
                </div>

                <div class="level-3-only">
                    <h2 class="macros-section-title">Programmation bloc</h2>
                    <div class="blocks-wrap">
                        <div class="blocks-palette">
                            <div>
                                <div class="pal-section-title">Actions</div>
                                <div id="pal-action"></div>
                            </div>
                            <div>
                                <div class="pal-section-title">Contrôle</div>
                                <div id="pal-control"></div>
                            </div>
                        </div>
                        <div class="blocks-editor">
                            <div class="blocks-toolbar">
                                <button id="btn-run">▶ Exécuter</button>
                                <button id="btn-stop" disabled="disabled">⏹ Stop</button>
                                <button id="btn-clear">🗑 Effacer</button>
                                <span id="prog-status" class="prog-status"></span>
                                <span class="toolbar-sep"></span>
                                <div class="save-row">
                                    <input id="save-name" type="text" placeholder="Nom du programme…" />
                                    <button id="btn-save">💾</button>
                                </div>
                            </div>
                            <div class="blocks-body">
                                <div id="prog-root"></div>
                                <div class="saved-panel">
                                    <h3>Sauvegardés</h3>
                                    <div id="saved-list"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div id="footer"></div>
    </div>

    <div class="joy3Div" id="joy3Div"></div>
    <script type="text/javascript">
    var Joy3 = new JoyStick('joy3Div', {"title": "joystick3"});
    setInterval(function(){ Joy3.GetDir(); }, 50);
    </script>

    <div class="joy3Div2" id="joy3Div2"></div>
    <script type="text/javascript">
    var Joy2 = new JoyStick2('joy3Div2', {"title": "joystick2"});
    setInterval(function(){ Joy2.GetDir(); }, 50);
    </script>

</body>
</html>
