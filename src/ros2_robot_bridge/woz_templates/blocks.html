<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Programme blocs</title>
    <link href="/static/woz.css" rel="stylesheet" type="text/css" />
    <script src="/static/jquery-3.5.1.min.js"></script>
    <script>var WOZ_RID = {{ rid }};</script>
    <script src="/static/woz.js"></script>
    <script src="/static/blocks.js"></script>
    <style>
        /* ─── Layout ─────────────────────────────────────────────── */
        .blocks-wrap {
            display: flex;
            height: calc(100vh - 82px);
            overflow: hidden;
        }

        /* ─── Palette ────────────────────────────────────────────── */
        .blocks-palette {
            width: 160px;
            flex-shrink: 0;
            background: #1a1a2e;
            border-right: 2px solid #333;
            overflow-y: auto;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .pal-section-title {
            font-size: 0.7em;
            font-weight: bold;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 4px;
        }
        .pal-blk {
            display: block;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.82em;
            color: #fff;
            cursor: grab;
            user-select: none;
            margin-bottom: 5px;
            border: none;
            text-align: left;
            transition: filter 0.15s;
        }
        .pal-blk:hover  { filter: brightness(1.25); }
        .pal-blk:active { cursor: grabbing; }

        /* ─── Editor panel ───────────────────────────────────────── */
        .blocks-editor {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .blocks-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: #111;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .blocks-toolbar button {
            padding: 6px 16px;
            border: none;
            border-radius: 5px;
            font-size: 0.9em;
            cursor: pointer;
            font-weight: bold;
        }
        #btn-run  { background: #2e7d32; color: #fff; }
        #btn-run:hover:not(:disabled)  { background: #43a047; }
        #btn-stop { background: #b71c1c; color: #fff; }
        #btn-stop:hover:not(:disabled) { background: #e53935; }
        #btn-clear { background: #444; color: #ccc; }
        #btn-clear:hover { background: #666; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .prog-status {
            font-size: 0.85em;
            color: #aaa;
            margin-left: 4px;
        }
        .prog-status--on { color: #76ff03; font-weight: bold; }

        .toolbar-sep { flex: 1; }

        .save-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .save-row input {
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #222;
            color: #eee;
            font-size: 0.85em;
            width: 140px;
        }
        #btn-save {
            background: #1565c0;
            color: #fff;
            padding: 5px 12px;
        }
        #btn-save:hover { background: #1976d2; }

        .blocks-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ─── Program area ───────────────────────────────────────── */
        #prog-root {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            min-height: 100%;
        }

        /* ─── Saved programs sidebar ─────────────────────────────── */
        .saved-panel {
            width: 180px;
            flex-shrink: 0;
            background: #111;
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 10px 8px;
        }
        .saved-panel h3 {
            font-size: 0.75em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 8px;
        }
        .saved-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 6px;
        }
        .saved-name {
            flex: 1;
            font-size: 0.82em;
            color: #ddd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .saved-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .saved-btn:hover { background: #333; }
        .saved-empty { font-size: 0.8em; color: #666; font-style: italic; }

        /* ─── Drop zones ─────────────────────────────────────────── */
        .dz {
            height: 8px;
            border-radius: 4px;
            margin: 1px 0;
            transition: all 0.15s;
        }
        .dz--hover {
            height: 28px;
            background: rgba(100,200,255,0.25);
            border: 2px dashed #4fc3f7;
        }
        .dz--hint {
            height: 40px;
            border: 2px dashed #444;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.85em;
            margin: 4px 0;
        }
        .dz--hint.dz--hover {
            border-color: #4fc3f7;
            color: #4fc3f7;
            background: rgba(100,200,255,0.1);
        }

        /* ─── Block elements ─────────────────────────────────────── */
        .blk {
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            background: #1e1e1e;
            margin: 0;
            cursor: grab;
            user-select: none;
        }
        .blk:active { cursor: grabbing; }

        .blk-hdr {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 8px;
            border-radius: 6px 6px 0 0;
            flex-wrap: wrap;
        }
        .blk:not(:has(.blk-body)) .blk-hdr {
            border-radius: 6px;
        }

        .blk-grip {
            color: rgba(255,255,255,0.5);
            font-size: 1.1em;
            cursor: grab;
        }
        .blk-lbl {
            font-size: 0.82em;
            font-weight: bold;
            color: rgba(255,255,255,0.95);
            white-space: nowrap;
        }
        .blk-del {
            margin-left: auto;
            background: rgba(0,0,0,0.35);
            border: none;
            color: rgba(255,255,255,0.6);
            border-radius: 4px;
            width: 22px;
            height: 22px;
            font-size: 1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            flex-shrink: 0;
        }
        .blk-del:hover { background: rgba(255,0,0,0.5); color: #fff; }

        .blk-field      { display: inline-flex; align-items: center; gap: 3px; }
        .blk-field-lbl  { font-size: 0.75em; color: rgba(255,255,255,0.7); white-space: nowrap; }
        .blk-select, .blk-text, .blk-num {
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 0.8em;
        }
        .blk-select { max-width: 130px; }
        .blk-text   { width: 160px; }
        .blk-num    { width: 52px; }
        .blk-color  { width: 34px; height: 22px; padding: 1px; border: none; border-radius: 4px; cursor: pointer; }

        .blk-range-wrap { display: inline-flex; align-items: center; gap: 4px; }
        .blk-range      { width: 70px; accent-color: rgba(255,255,255,0.8); }
        .blk-range-val  { font-size: 0.78em; color: rgba(255,255,255,0.8); min-width: 22px; }

        /* Container block inner area */
        .blk-branch-lbl {
            font-size: 0.72em;
            color: #aaa;
            padding: 3px 10px 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .blk-body {
            padding: 4px 6px 6px 20px;
            background: rgba(0,0,0,0.2);
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .blk:last-child .blk-body { border-radius: 0 0 6px 6px; }
    </style>
</head>

<body onload="blocksInit()">
<div id="content">
    <div id="header">
        <div id="breadcrumb">{{ child_name }}
            <a href="/robots"><img src="/static/images/back.png" width="3%" alt="back" /></a>
        </div>
        <div class="tab tab--off"><a href="/r/{{ rid }}/scenarios">Scénario et Jeux</a></div>
        <div class="tab tab--off"><a href="/r/{{ rid }}/reactions">Réactions</a></div>
        <div class="tab tab--off"><a href="/r/{{ rid }}/maison">Maison</a></div>
        <div class="tab tab--off"><a href="/r/{{ rid }}/macros">Macros</a></div>
        <div class="tab tab--off"><a href="/r/{{ rid }}/vocal">Vocal</a></div>
        <div class="tab tab--on" ><a href="/r/{{ rid }}/blocks">Programme</a></div>
    </div>

    <div id="body" style="padding:0; overflow:hidden;">
        <div class="blocks-wrap">

            <!-- Palette -->
            <div class="blocks-palette">
                <div>
                    <div class="pal-section-title">Actions</div>
                    <div id="pal-action"></div>
                </div>
                <div>
                    <div class="pal-section-title">Contrôle</div>
                    <div id="pal-control"></div>
                </div>
            </div>

            <!-- Editor -->
            <div class="blocks-editor">
                <div class="blocks-toolbar">
                    <button id="btn-run">▶ Exécuter</button>
                    <button id="btn-stop" disabled="disabled">⏹ Stop</button>
                    <button id="btn-clear">🗑 Effacer</button>
                    <span id="prog-status" class="prog-status"></span>
                    <span class="toolbar-sep"></span>
                    <div class="save-row">
                        <input id="save-name" type="text" placeholder="Nom du programme…" />
                        <button id="btn-save">💾 Sauvegarder</button>
                    </div>
                </div>

                <div class="blocks-body">
                    <div id="prog-root"></div>

                    <div class="saved-panel">
                        <h3>Programmes sauvegardés</h3>
                        <div id="saved-list"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="footer"></div>
</div>
</body>
</html>
