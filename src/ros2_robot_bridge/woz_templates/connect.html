<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Connexion au robot</title>
    <link href="static/woz.css" rel="stylesheet" type="text/css" />
    <script src="static/jquery-3.5.1.min.js"></script>
</head>

<body>

<div id="content">
    <div id="header">
        <div id="breadcrumb">Contrôle du robot</div>
    </div>

    <div id="body">
        <div id="body-left"></div>
        <div id="body-right"></div>

        <div class="main-container">
            <div class='auth-circle-container'>
                <form action="/connect" method='post' onsubmit="return verify()">
                    <h1>Connexion au robot</h1>

                    <label for="robot_type">Type de robot :</label><br>
                    <select id="robot_type" name="robot_type" onchange="updateVersions()">
                        <option value="nao">NAO</option>
                        <option value="pepper">Pepper</option>
                        <option value="qtrobot">QTrobot</option>
                    </select><br><br>

                    <label for="robot_version">Version :</label><br>
                    <select id="robot_version" name="robot_version">
                    </select><br><br>

                    <label for="robot_ip">Adresse IP :</label><br>
                    <input type="text" id="robot_ip" name="robot_ip"
                           placeholder="192.168.1.100" value="{{ robot_ip }}"><br><br>

                    <input type="submit" value="Se connecter">
                </form>
            </div>
        </div>
    </div>

    <div id="footer"></div>
</div>

<script><!--

var VERSIONS = {
    'nao':     ['v5', 'v6'],
    'pepper':  ['v1', 'v1.8', 'v2'],
    'qtrobot': ['qt1', 'qt2']
};

function updateVersions() {
    var type = document.getElementById('robot_type').value;
    var sel  = document.getElementById('robot_version');
    sel.innerHTML = '';
    VERSIONS[type].forEach(function(v) {
        var opt   = document.createElement('option');
        opt.value = v;
        opt.text  = v;
        sel.appendChild(opt);
    });
}

function verify() {
    var ip = document.getElementById('robot_ip').value.trim();
    if (!ip) {
        alert("Veuillez entrer l'adresse IP du robot.");
        return false;
    }
    return true;
}

(function() {
    var savedType    = "{{ robot_type }}";
    var savedVersion = "{{ robot_version }}";
    if (savedType) {
        document.getElementById('robot_type').value = savedType;
    }
    updateVersions();
    if (savedVersion) {
        document.getElementById('robot_version').value = savedVersion;
    }
})();

--></script>

</body>
</html>
