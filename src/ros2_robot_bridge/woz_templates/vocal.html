<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Vocal</title>
    <link href="/static/woz.css" rel="stylesheet" type="text/css" />
    <script src="/static/jquery-3.5.1.min.js"></script>
    <script>var WOZ_RID = {{ rid }};</script>
    <script src="/static/woz.js"></script>
    <script src="/static/vocal.js"></script>
</head>

<body onload="onLoad()">

    <div id="content">
        <div id="header">
            <div id="breadcrumb">{{ child_name }}
                <a href="/robots"><img src="/static/images/back.png" width="3%" alt="back" /></a>
            </div>

            <div class="tab tab--off">
            <a href="/r/{{ rid }}/scenarios">Scénario et Jeux</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/reactions">Réactions</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/maison">Maison</a></div>
            <div class="tab tab--off">
            <a href="/r/{{ rid }}/macros">Macros</a></div>
            <div class="tab tab--on">
            <a href="/r/{{ rid }}/vocal">Vocal</a></div>
        </div>

        <div id="body">
            <div id="body-left"></div>
            <div id="body-right"></div>

            <div class="vocal-container">

                <div class="vocal-mode-row">
                    <button id="mode-repeat" class="vocal-mode-btn vocal-mode-btn--on">🔊 Répéter</button>
                    <button id="mode-command" class="vocal-mode-btn">🤖 Commander</button>
                </div>

                <div class="vocal-mode-desc" id="mode-desc-repeat">
                    Parlez au robot !
                </div>

                <button id="btn-mic" class="vocal-mic-btn">
                    <span class="vocal-mic-icon">🎤</span>
                    <span class="vocal-mic-label">Appuyer pour parler</span>
                </button>

                <div id="vocal-status" class="vocal-status vocal-status--idle">Prêt</div>
                <div id="interim-text" class="vocal-interim"></div>

                <div class="vocal-speed-row">
                    <span class="vocal-speed-label">Vitesse</span>
                    <input id="speed-slider" class="vocal-speed-slider" type="range" min="0.1" max="1.0" step="0.05" value="0.5" />
                    <span class="vocal-speed-value" id="speed-value">0.50</span>
                </div>

                <div id="history" class="vocal-history"></div>

                <div class="vocal-https-note">
                    Si le navigateur bloque le micro, acceptez le certificat auto-signé dans l'avertissement de sécurité.
                </div>

            </div>
        </div>

        <div id="footer"></div>
    </div>

    <div class="joy3Div" id="joy3Div"></div>
    <script type="text/javascript">
    var Joy3 = new JoyStick('joy3Div', {"title": "joystick3"});
    setInterval(function(){ Joy3.GetDir(); }, 50);
    </script>

    <div class="joy3Div2" id="joy3Div2"></div>
    <script type="text/javascript">
    var Joy2 = new JoyStick2('joy3Div2', {"title": "joystick2"});
    setInterval(function(){ Joy2.GetDir(); }, 50);
    </script>

</body>
</html>
